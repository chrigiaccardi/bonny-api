<VirtualHost *:8080>
    ServerName localhost

    DocumentRoot "/Users/christianerita/Desktop/Master_Web_Development_Christian/bonny-api/public"

    <Directory "/Users/christianerita/Desktop/Master_Web_Development_Christian/bonny-api/public">
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    ErrorLog "/opt/homebrew/var/log/httpd/bonny-error.log"
    CustomLog "/opt/homebrew/var/log/httpd/bonny-access.log" combined
</VirtualHost>
